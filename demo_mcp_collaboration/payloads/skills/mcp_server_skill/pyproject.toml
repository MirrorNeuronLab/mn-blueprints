[project]
name = "mirrorneuron-mcp-server-skill"
version = "1.2.30"
description = "Job-scoped MCP servers for exchanging bounded status, knowledge, and staged or final results."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.27,<2"]

[project.scripts]
mn-job-mcp-server = "mn_mcp_server_skill.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
