[project]
name = "mirrorneuron-mcp-client-skill"
version = "1.2.31"
description = "Reusable MCP client helpers for discovering and invoking existing MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
runtime = ["mirrorneuron-python-sdk>=1.2.31"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
